[package]
name = "velvet"
version = "2.0.0"
description = "Velvet music player"
authors = ["Velvet"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "velvet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json", "query", "stream", "gzip", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
lofty = "0.25"
walkdir = "2"
rayon = "1"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
souvlaki = "0.9"
percent-encoding = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
unicode-normalization = "0.1"
url = "2"
base64 = "0.23"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
